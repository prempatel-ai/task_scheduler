<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="t d">
  <title id="t">Architecture</title>
  <desc id="d">A client submits jobs to the coordinator's HTTP API. The coordinator stores job state in SQLite and runs a sweeper thread. Workers pull jobs from the API.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .zone { fill: #f0f7ff; stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1e293b; }
      .z { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .6px; fill: #0284c7; }
      .ln { fill: none; stroke: #64748b; stroke-width: 1.5; }
      .lb { fill: none; stroke: #0284c7; stroke-width: 1.5; }

      /* Crisp animated flow streams */
      .flow-submit {
        fill: none;
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 6 12;
        animation: flowRight 1.6s linear infinite;
      }
      .flow-query {
        fill: none;
        stroke: #64748b;
        stroke-width: 2;
        stroke-dasharray: 5 10;
        animation: flowLeft 2s linear infinite;
      }
      .flow-worker1 {
        fill: none;
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 6 10;
        animation: flowLeft 1.8s linear infinite;
      }
      .flow-worker2 {
        fill: none;
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 6 10;
        animation: flowWorker2 2.4s linear infinite;
      }
      .flow-db {
        fill: none;
        stroke: #d97706;
        stroke-width: 2;
        stroke-dasharray: 4 8;
        animation: flowDown 1.8s linear infinite;
      }

      /* Clean crisp packet */
      .packet {
        animation: movePacketSubmit 3s ease-in-out infinite;
      }

      @keyframes flowRight {
        from { stroke-dashoffset: 18; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowLeft {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 18; }
      }
      @keyframes flowDown {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowWorker2 {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes movePacketSubmit {
        0% { cx: 160; cy: 84; opacity: 0; }
        10% { opacity: 1; }
        85% { opacity: 1; }
        100% { cx: 315; cy: 84; opacity: 0; }
      }
    </style>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0284c7"/></marker>
  </defs>

  <rect class="bg" x=".5" y=".5" width="959" height="369" rx="16"/>

  <!-- Client -->
  <g id="client-node">
    <rect class="box" x="30" y="62" width="130" height="70" rx="10"/>
    <circle cx="48" cy="80" r="4" fill="#0284c7"/>
    <text class="t" x="95" y="92" text-anchor="middle">Client</text>
    <text class="s" x="95" y="112" text-anchor="middle">submits jobs</text>
  </g>

  <!-- Coordinator -->
  <g id="coordinator-zone">
    <rect class="zone" x="290" y="30" width="420" height="300" rx="14"/>
    <circle cx="310" cy="52" r="4" fill="#16a34a"/>
    <text class="z" x="322" y="56">COORDINATOR (FASTAPI)</text>

    <!-- HTTP API -->
    <rect class="box" x="315" y="65" width="370" height="64" rx="10"/>
    <text class="t" x="500" y="92" text-anchor="middle">HTTP API</text>
    <text class="s" x="500" y="112" text-anchor="middle">submit · claim · heartbeat · complete · fail</text>

    <!-- Sweeper -->
    <g transform="translate(0, 0)">
      <rect class="box" x="315" y="215" width="150" height="76" rx="10"/>
      <circle cx="332" cy="235" r="4.5" fill="#d97706"/>
      <text class="t" x="390" y="243" text-anchor="middle">Sweeper</text>
      <text class="s" x="390" y="262" text-anchor="middle">finds expired leases</text>
      <text class="s" x="390" y="278" text-anchor="middle">and requeues them</text>
    </g>

    <!-- SQLite -->
    <path class="box" d="M525 205 V281 A80 12 0 0 0 685 281 V205"/>
    <ellipse class="box" cx="605" cy="205" rx="80" ry="12"/>
    <text class="t" x="605" y="240" text-anchor="middle">SQLite</text>
    <text class="s" x="605" y="258" text-anchor="middle">one jobs table</text>
    <text class="s" x="605" y="274" text-anchor="middle">status, leases, results</text>
  </g>

  <!-- Flow Lines: Client <-> API -->
  <path class="lb" d="M160 84 H315" marker-end="url(#ab)"/>
  <path class="flow-submit" d="M160 84 H315"/>
  <circle class="packet" r="3.5" fill="#0284c7"/>
  <text class="m" x="237" y="76" text-anchor="middle">POST /jobs</text>

  <path class="ln" d="M315 112 H160" marker-end="url(#ag)"/>
  <path class="flow-query" d="M315 112 H160"/>
  <text class="m" x="237" y="128" text-anchor="middle">GET /jobs/{id}</text>

  <!-- Coordinator Internal Flows -->
  <path class="ln" d="M605 129 V192" marker-end="url(#ag)"/>
  <path class="flow-db" d="M605 129 V192"/>
  <path class="ln" d="M465 253 H525" marker-end="url(#ag)"/>
  <path class="flow-db" d="M465 253 H525"/>

  <!-- Workers -->
  <g id="worker-a">
    <rect class="box" x="790" y="45" width="140" height="76" rx="10"/>
    <circle cx="808" cy="64" r="4.5" fill="#0284c7"/>
    <text class="t" x="860" y="74" text-anchor="middle">Worker A</text>
    <text class="s" x="860" y="92" text-anchor="middle">pulls jobs</text>
    <text class="s" x="860" y="108" text-anchor="middle">reports results</text>
  </g>

  <g id="worker-b">
    <rect class="box" x="790" y="212" width="140" height="76" rx="10"/>
    <circle cx="808" cy="231" r="4.5" fill="#0284c7"/>
    <text class="t" x="860" y="241" text-anchor="middle">Worker B</text>
    <text class="s" x="860" y="259" text-anchor="middle">pulls jobs</text>
    <text class="s" x="860" y="275" text-anchor="middle">reports results</text>
  </g>

  <!-- Worker Flows -->
  <path class="lb" d="M790 83 H685" marker-end="url(#ab)"/>
  <path class="flow-worker1" d="M790 83 H685"/>

  <path class="lb" d="M790 250 H748 V111 H685" marker-end="url(#ab)"/>
  <path class="flow-worker2" d="M790 250 H748 V111 H685"/>

  <text class="s" x="480" y="354" text-anchor="middle">Workers pull jobs from the coordinator. The coordinator never pushes work to them.</text>
</svg>
