<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Architecture</title>
  <desc id="d">A client submits jobs to the coordinator's HTTP API. The coordinator stores job state in SQLite and runs a sweeper thread. Workers pull jobs from the API.</desc>
  <defs>
    <style>
      .bg{fill:#ffffff;stroke:#d0d7de}
      .box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
      .zone{fill:#f5f9ff;stroke:#0969da;stroke-width:1.5;stroke-dasharray:6 5}
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;fill:#1f2328}
      .s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:#656d76}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#24292f}
      .z{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:.6px;fill:#0969da}
      .ln{fill:none;stroke:#656d76;stroke-width:1.5}
      .lb{fill:none;stroke:#0969da;stroke-width:1.5}
    </style>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#656d76"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker>
  </defs>

  <rect class="bg" x=".5" y=".5" width="959" height="369" rx="16"/>

  <!-- Client -->
  <rect class="box" x="30" y="62" width="130" height="70" rx="10"/>
  <text class="t" x="95" y="92" text-anchor="middle">Client</text>
  <text class="s" x="95" y="112" text-anchor="middle">submits jobs</text>


  <!-- Coordinator -->
  <rect class="zone" x="290" y="30" width="420" height="300" rx="14"/>
  <text class="z" x="310" y="52">COORDINATOR (FASTAPI)</text>

  <rect class="box" x="315" y="65" width="370" height="64" rx="10"/>
  <text class="t" x="500" y="92" text-anchor="middle">HTTP API</text>
  <text class="s" x="500" y="112" text-anchor="middle">submit · claim · heartbeat · complete · fail</text>

  <rect class="box" x="315" y="215" width="150" height="76" rx="10"/>
  <text class="t" x="390" y="243" text-anchor="middle">Sweeper</text>
  <text class="s" x="390" y="262" text-anchor="middle">finds expired leases</text>
  <text class="s" x="390" y="278" text-anchor="middle">and requeues them</text>

  <path class="box" d="M525 205 V281 A80 12 0 0 0 685 281 V205"/>
  <ellipse class="box" cx="605" cy="205" rx="80" ry="12"/>
  <text class="t" x="605" y="240" text-anchor="middle">SQLite</text>
  <text class="s" x="605" y="258" text-anchor="middle">one jobs table</text>
  <text class="s" x="605" y="274" text-anchor="middle">status, leases, results</text>

  <path class="lb" d="M160 84 H315" marker-end="url(#ab)"/>
  <text class="m" x="237" y="76" text-anchor="middle">POST /jobs</text>
  <path class="ln" d="M315 112 H160" marker-end="url(#ag)"/>
  <text class="m" x="237" y="128" text-anchor="middle">GET /jobs/{id}</text>

  <path class="ln" d="M605 129 V192" marker-end="url(#ag)"/>
  <path class="ln" d="M465 253 H525" marker-end="url(#ag)"/>

  <!-- Workers -->
  <rect class="box" x="790" y="45" width="140" height="76" rx="10"/>
  <text class="t" x="860" y="74" text-anchor="middle">Worker A</text>
  <text class="s" x="860" y="92" text-anchor="middle">pulls jobs</text>
  <text class="s" x="860" y="108" text-anchor="middle">reports results</text>

  <rect class="box" x="790" y="212" width="140" height="76" rx="10"/>
  <text class="t" x="860" y="241" text-anchor="middle">Worker B</text>
  <text class="s" x="860" y="259" text-anchor="middle">pulls jobs</text>
  <text class="s" x="860" y="275" text-anchor="middle">reports results</text>

  <path class="lb" d="M790 83 H685" marker-end="url(#ab)"/>
  <path class="lb" d="M790 250 H748 V111 H685" marker-end="url(#ab)"/>

  <text class="s" x="480" y="354" text-anchor="middle">Workers pull jobs from the coordinator. The coordinator never pushes work to them.</text>
</svg>
