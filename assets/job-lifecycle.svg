<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="t d">
  <title id="t">Job lifecycle</title>
  <desc id="d">A job starts queued. A claim moves it to running. A heartbeat keeps it running. Completion moves it to completed. An expired lease or reported failure returns it to queued while attempts remain, or moves it to failed when none remain.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; }
      .pq { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
      .pr { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.5; }
      .pc { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .pf { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
      .e { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748b; }
      .eb { fill: none; stroke: #0284c7; stroke-width: 1.5; }
      .ea { fill: none; stroke: #d97706; stroke-width: 1.5; }
      .eg { fill: none; stroke: #16a34a; stroke-width: 1.5; }
      .er { fill: none; stroke: #dc2626; stroke-width: 1.5; }
      .ex { fill: none; stroke: #64748b; stroke-width: 1.5; }

      /* Crisp flow stream animations */
      .stream-claim {
        fill: none;
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 6 10;
        animation: streamForward 1.4s linear infinite;
      }
      .stream-complete {
        fill: none;
        stroke: #16a34a;
        stroke-width: 2.2;
        stroke-dasharray: 6 10;
        animation: streamForward 1.6s linear infinite;
      }
      .stream-retry {
        fill: none;
        stroke: #d97706;
        stroke-width: 2.2;
        stroke-dasharray: 6 10;
        animation: streamBackward 2.4s linear infinite;
      }
      .stream-fail {
        fill: none;
        stroke: #dc2626;
        stroke-width: 2.2;
        stroke-dasharray: 6 10;
        animation: streamForward 1.8s linear infinite;
      }
      .stream-heartbeat {
        fill: none;
        stroke: #0284c7;
        stroke-width: 2;
        stroke-dasharray: 4 8;
        animation: streamForward 1.5s linear infinite;
      }

      @keyframes streamForward {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes streamBackward {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 32; }
      }
    </style>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0284c7"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  </defs>

  <rect class="bg" x=".5" y=".5" width="959" height="349" rx="16"/>

  <!-- submit initial point -->
  <circle cx="26" cy="190" r="5" fill="#64748b"/>
  <path class="ex" d="M31 190 H60" marker-end="url(#ag)"/>
  <text class="s" x="34" y="170" text-anchor="middle">submit</text>

  <!-- States (Crisp solid pills) -->
  <!-- Queued -->
  <g id="state-queued">
    <rect class="pq" x="60" y="168" width="140" height="44" rx="22"/>
    <text class="t" x="130" y="195" text-anchor="middle">queued</text>
  </g>

  <!-- Running -->
  <g id="state-running">
    <rect class="pr" x="380" y="168" width="140" height="44" rx="22"/>
    <text class="t" x="450" y="195" text-anchor="middle">running</text>
  </g>

  <!-- Completed -->
  <g id="state-completed">
    <rect class="pc" x="780" y="90" width="140" height="44" rx="22"/>
    <text class="t" x="850" y="117" text-anchor="middle">completed</text>
  </g>

  <!-- Failed -->
  <g id="state-failed">
    <rect class="pf" x="780" y="246" width="140" height="44" rx="22"/>
    <text class="t" x="850" y="273" text-anchor="middle">failed</text>
  </g>

  <!-- Claim Transition -->
  <path class="eb" d="M200 190 H380" marker-end="url(#ab)"/>
  <path class="stream-claim" d="M200 190 H380"/>
  <text class="e" x="290" y="180" text-anchor="middle">claim</text>
  <text class="s" x="290" y="210" text-anchor="middle">attempt + 1, lease starts</text>

  <!-- Heartbeat Loop -->
  <path class="eb" d="M420 168 C400 118, 500 118, 480 168" marker-end="url(#ab)"/>
  <path class="stream-heartbeat" d="M420 168 C400 118, 500 118, 480 168"/>
  <text class="e" x="450" y="92" text-anchor="middle">heartbeat</text>
  <text class="s" x="450" y="108" text-anchor="middle">extends the lease</text>

  <!-- Retry Loop (Bottom) -->
  <path class="ea" d="M450 212 C450 292, 130 292, 130 212" marker-end="url(#aa)"/>
  <path class="stream-retry" d="M450 212 C450 292, 130 292, 130 212"/>
  <text class="e" x="290" y="304" text-anchor="middle">lease expired, or the worker reports a failure</text>
  <text class="s" x="290" y="322" text-anchor="middle">attempts left: retry after a backoff delay</text>

  <!-- Complete Transition -->
  <path class="eg" d="M520 180 C650 180, 650 112, 780 112" marker-end="url(#ae)"/>
  <path class="stream-complete" d="M520 180 C650 180, 650 112, 780 112"/>
  <text class="e" x="650" y="136" text-anchor="middle">complete</text>
  <text class="s" x="650" y="152" text-anchor="middle">first result stored</text>

  <!-- Fail Transition -->
  <path class="er" d="M520 200 C650 200, 650 268, 780 268" marker-end="url(#ar)"/>
  <path class="stream-fail" d="M520 200 C650 200, 650 268, 780 268"/>
  <text class="e" x="650" y="244" text-anchor="middle">max attempts reached</text>
  <text class="s" x="650" y="260" text-anchor="middle">job marked failed</text>
</svg>
