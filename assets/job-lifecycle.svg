<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Job lifecycle</title>
  <desc id="d">A job starts queued. A claim moves it to running. A heartbeat keeps it running. Completion moves it to completed. An expired lease or reported failure returns it to queued while attempts remain, or moves it to failed when none remain.</desc>
  <defs>
    <style>
      .bg{fill:#ffffff;stroke:#d0d7de}
      .pq{fill:rgba(191,135,0,.12);stroke:#bf8700;stroke-width:1.5}
      .pr{fill:rgba(9,105,218,.10);stroke:#0969da;stroke-width:1.5}
      .pc{fill:rgba(26,127,55,.10);stroke:#1a7f37;stroke-width:1.5}
      .pf{fill:rgba(207,34,46,.10);stroke:#cf222e;stroke-width:1.5}
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;fill:#1f2328}
      .e{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600;fill:#24292f}
      .s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11.5px;fill:#656d76}
      .eb{fill:none;stroke:#0969da;stroke-width:1.5}
      .ea{fill:none;stroke:#bf8700;stroke-width:1.5}
      .eg{fill:none;stroke:#1a7f37;stroke-width:1.5}
      .er{fill:none;stroke:#cf222e;stroke-width:1.5}
      .ex{fill:none;stroke:#656d76;stroke-width:1.5}
    </style>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#656d76"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bf8700"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker>
  </defs>

  <rect class="bg" x=".5" y=".5" width="959" height="349" rx="16"/>

  <!-- start -->
  <circle cx="26" cy="190" r="5" fill="#656d76"/>
  <path class="ex" d="M31 190 H60" marker-end="url(#ag)"/>
  <text class="s" x="34" y="170" text-anchor="middle">submit</text>

  <!-- states -->
  <rect class="pq" x="60" y="168" width="140" height="44" rx="22"/>
  <text class="t" x="130" y="195" text-anchor="middle">queued</text>
  <rect class="pr" x="380" y="168" width="140" height="44" rx="22"/>
  <text class="t" x="450" y="195" text-anchor="middle">running</text>
  <rect class="pc" x="780" y="90" width="140" height="44" rx="22"/>
  <text class="t" x="850" y="117" text-anchor="middle">completed</text>
  <rect class="pf" x="780" y="246" width="140" height="44" rx="22"/>
  <text class="t" x="850" y="273" text-anchor="middle">failed</text>

  <!-- claim -->
  <path class="eb" d="M200 190 H380" marker-end="url(#ab)"/>
  <text class="e" x="290" y="180" text-anchor="middle">claim</text>
  <text class="s" x="290" y="210" text-anchor="middle">attempt + 1, lease starts</text>

  <!-- heartbeat loop -->
  <path class="eb" d="M420 168 C400 118, 500 118, 480 168" marker-end="url(#ab)"/>
  <text class="e" x="450" y="92" text-anchor="middle">heartbeat</text>
  <text class="s" x="450" y="108" text-anchor="middle">extends the lease</text>

  <!-- retry -->
  <path class="ea" d="M450 212 C450 292, 130 292, 130 212" marker-end="url(#aa)"/>
  <text class="e" x="290" y="304" text-anchor="middle">lease expired, or the worker reports a failure</text>
  <text class="s" x="290" y="322" text-anchor="middle">attempts left: retry after a backoff delay</text>

  <!-- complete -->
  <path class="eg" d="M520 180 C650 180, 650 112, 780 112" marker-end="url(#ae)"/>
  <text class="e" x="650" y="84" text-anchor="middle">complete</text>
  <text class="s" x="650" y="100" text-anchor="middle">first result wins</text>

  <!-- give up -->
  <path class="er" d="M520 200 C650 200, 650 268, 780 268" marker-end="url(#ar)"/>
  <text class="e" x="650" y="296" text-anchor="middle">no attempts left</text>
  <text class="s" x="650" y="312" text-anchor="middle">attempts reached max_attempts</text>

  <text class="s" x="850" y="154" text-anchor="middle">final</text>
  <text class="s" x="850" y="310" text-anchor="middle">final</text>
</svg>
