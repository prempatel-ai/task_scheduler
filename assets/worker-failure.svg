<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="t d">
  <title id="t">A worker dies mid-job</title>
  <desc id="d">Worker A claims job 50 and sends a heartbeat, then loses power. The lease expires and the sweeper requeues the job. Worker B claims it and completes it. Worker A comes back and sends a late result, which the coordinator ignores.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .life { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 5; }
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
      .e { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748b; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1e293b; }
      .good { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #16a34a; }
      .bad { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #dc2626; }
      .eb { fill: none; stroke: #0284c7; stroke-width: 1.5; }
      .ex { fill: none; stroke: #64748b; stroke-width: 1.5; }
      .eg { fill: none; stroke: #16a34a; stroke-width: 1.5; }
      .ea { fill: none; stroke: #d97706; stroke-width: 1.5; }
      .er { fill: none; stroke: #dc2626; stroke-width: 1.5; }
      .note { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }

      /* Crisp flow animations */
      .anim-stream-blue {
        fill: none;
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 6 10;
        animation: streamRight 1.5s linear infinite;
      }
      .anim-stream-green {
        fill: none;
        stroke: #16a34a;
        stroke-width: 2.2;
        stroke-dasharray: 6 10;
        animation: streamLeft 1.5s linear infinite;
      }
      .anim-stream-red {
        fill: none;
        stroke: #dc2626;
        stroke-width: 2.2;
        stroke-dasharray: 6 10;
        animation: streamRight 1.5s linear infinite;
      }

      @keyframes streamRight {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes streamLeft {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 32; }
      }
    </style>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0284c7"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  </defs>

  <rect class="bg" x=".5" y=".5" width="959" height="689" rx="16"/>

  <!-- Lanes -->
  <rect class="box" x="80" y="22" width="140" height="40" rx="10"/>
  <text class="t" x="150" y="47" text-anchor="middle">Worker A</text>
  <rect class="box" x="410" y="22" width="140" height="40" rx="10"/>
  <text class="t" x="480" y="47" text-anchor="middle">Coordinator</text>
  <rect class="box" x="740" y="22" width="140" height="40" rx="10"/>
  <text class="t" x="810" y="47" text-anchor="middle">Worker B</text>

  <path class="life" d="M150 62 V655"/>
  <path class="life" d="M480 62 V655"/>
  <path class="life" d="M810 62 V655"/>

  <!-- A claims -->
  <path class="eb" d="M150 105 H480" marker-end="url(#ab)"/>
  <path class="anim-stream-blue" d="M150 105 H480"/>
  <text class="m" x="315" y="97" text-anchor="middle">POST /claim</text>
  <path class="ex" d="M480 140 H150" marker-end="url(#ag)"/>
  <text class="s" x="315" y="132" text-anchor="middle">job 50 · attempt 1 · lease starts</text>

  <!-- Heartbeat -->
  <path class="eb" d="M150 185 H480" marker-end="url(#ab)"/>
  <circle cx="315" cy="185" r="4" fill="#0284c7"/>
  <text class="m" x="315" y="177" text-anchor="middle">POST /jobs/50/heartbeat</text>

  <!-- A dies (Sharp, clean X with zero blurry halos) -->
  <g transform="translate(0, 0)">
    <path d="M141 223 L159 241 M159 223 L141 241" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="bad" x="176" y="237">Worker A loses power</text>

  <!-- Sweeper note -->
  <rect class="note" x="345" y="278" width="270" height="62" rx="8"/>
  <text class="e" x="480" y="302" text-anchor="middle">Lease expires with no heartbeat</text>
  <text class="s" x="480" y="322" text-anchor="middle">Sweeper requeues job 50 (attempt 1 of 3)</text>

  <!-- B claims -->
  <path class="eb" d="M810 375 H480" marker-end="url(#ab)"/>
  <path class="anim-stream-blue" d="M810 375 H480" style="animation-direction: reverse;"/>
  <text class="m" x="645" y="367" text-anchor="middle">POST /claim</text>
  <path class="ex" d="M480 410 H810" marker-end="url(#ag)"/>
  <text class="s" x="645" y="402" text-anchor="middle">job 50 · attempt 2 · new lease</text>

  <!-- B completes -->
  <path class="eg" d="M810 455 H480" marker-end="url(#ae)"/>
  <path class="anim-stream-green" d="M810 455 H480"/>
  <text class="m" x="645" y="447" text-anchor="middle">POST /jobs/50/complete</text>
  <path class="ex" d="M480 490 H810" marker-end="url(#ag)"/>
  <text class="good" x="645" y="482" text-anchor="middle">200 OK · updated: true · stored</text>

  <!-- A comes back and tries to complete -->
  <g transform="translate(0, 10)">
    <circle cx="150" cy="530" r="4" fill="#64748b"/>
    <text class="s" x="176" y="534">Worker A recovers and finishes late</text>
    <path class="er" d="M150 565 H480" marker-end="url(#ar)"/>
    <path class="anim-stream-red" d="M150 565 H480"/>
    <text class="m" x="315" y="557" text-anchor="middle">POST /jobs/50/complete</text>
    <path class="ex" d="M480 600 H150" marker-end="url(#ag)"/>
    <text class="bad" x="315" y="592" text-anchor="middle">200 OK · updated: false · ignored</text>
  </g>

  <text class="s" x="480" y="665" text-anchor="middle">Only one result is ever stored. The first completion to commit wins.</text>
</svg>
