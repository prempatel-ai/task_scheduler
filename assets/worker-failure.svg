<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">A worker dies mid-job</title>
  <desc id="d">Worker A claims job 50 and sends a heartbeat, then loses power. The lease expires and the sweeper requeues the job. Worker B claims it and completes it. Worker A comes back and sends a late result, which the coordinator ignores.</desc>
  <defs>
    <style>
      .bg{fill:#ffffff;stroke:#d0d7de}
      .box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
      .life{stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 5}
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;fill:#1f2328}
      .e{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600;fill:#24292f}
      .s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11.5px;fill:#656d76}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#24292f}
      .good{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600;fill:#1a7f37}
      .bad{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600;fill:#cf222e}
      .eb{fill:none;stroke:#0969da;stroke-width:1.5}
      .ex{fill:none;stroke:#656d76;stroke-width:1.5}
      .eg{fill:none;stroke:#1a7f37;stroke-width:1.5}
      .ea{fill:none;stroke:#bf8700;stroke-width:1.5}
      .er{fill:none;stroke:#cf222e;stroke-width:1.5}
      .note{fill:#f6f8fa;stroke-width:1.5}
    </style>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#656d76"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bf8700"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker>
  </defs>

  <rect class="bg" x=".5" y=".5" width="959" height="689" rx="16"/>

  <!-- lanes -->
  <rect class="box" x="80" y="22" width="140" height="40" rx="10"/>
  <text class="t" x="150" y="47" text-anchor="middle">Worker A</text>
  <rect class="box" x="410" y="22" width="140" height="40" rx="10"/>
  <text class="t" x="480" y="47" text-anchor="middle">Coordinator</text>
  <rect class="box" x="740" y="22" width="140" height="40" rx="10"/>
  <text class="t" x="810" y="47" text-anchor="middle">Worker B</text>
  <path class="life" d="M150 62 V655"/>
  <path class="life" d="M480 62 V655"/>
  <path class="life" d="M810 62 V655"/>

  <!-- A claims -->
  <path class="eb" d="M150 105 H480" marker-end="url(#ab)"/>
  <text class="m" x="315" y="97" text-anchor="middle">POST /claim</text>
  <path class="ex" d="M480 140 H150" marker-end="url(#ag)"/>
  <text class="s" x="315" y="132" text-anchor="middle">job 50 · attempt 1 · lease starts</text>

  <!-- heartbeat -->
  <path class="eb" d="M150 185 H480" marker-end="url(#ab)"/>
  <text class="m" x="315" y="177" text-anchor="middle">POST /jobs/50/heartbeat</text>

  <!-- A dies -->
  <path d="M141 223 L159 241 M159 223 L141 241" stroke="#cf222e" stroke-width="3" stroke-linecap="round"/>
  <text class="bad" x="176" y="237">Worker A loses power</text>

  <!-- sweeper note -->
  <rect class="note" x="345" y="278" width="270" height="62" rx="8" stroke="#bf8700"/>
  <text class="e" x="480" y="302" text-anchor="middle">Lease expires with no heartbeat</text>
  <text class="s" x="480" y="322" text-anchor="middle">Sweeper requeues job 50 (attempt 1 of 3)</text>

  <!-- B claims -->
  <path class="eb" d="M810 385 H480" marker-end="url(#ab)"/>
  <text class="m" x="645" y="377" text-anchor="middle">POST /claim</text>
  <path class="ex" d="M480 420 H810" marker-end="url(#ag)"/>
  <text class="s" x="645" y="412" text-anchor="middle">job 50 · attempt 2</text>

  <!-- B completes -->
  <path class="eb" d="M810 465 H480" marker-end="url(#ab)"/>
  <text class="m" x="645" y="457" text-anchor="middle">POST /jobs/50/complete</text>
  <path class="eg" d="M480 500 H810" marker-end="url(#ae)"/>
  <text class="good" x="645" y="492" text-anchor="middle">updated: true</text>

  <rect class="note" x="360" y="522" width="240" height="34" rx="8" stroke="#1a7f37"/>
  <text class="good" x="480" y="544" text-anchor="middle">job 50 completed, result stored</text>

  <!-- A returns late -->
  <path class="ea" d="M150 600 H480" marker-end="url(#aa)"/>
  <text class="s" x="315" y="576" text-anchor="middle">Worker A is back and finishes late</text>
  <text class="m" x="315" y="592" text-anchor="middle">POST /jobs/50/complete</text>
  <path class="er" d="M480 635 H150" marker-end="url(#ar)"/>
  <text class="bad" x="315" y="627" text-anchor="middle">updated: false · result ignored</text>

  <text class="s" x="480" y="676" text-anchor="middle">The job ran twice. One result is stored.</text>
</svg>
